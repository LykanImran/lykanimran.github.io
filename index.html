<!DOCTYPE html>
<html>

<head>
  <!--

    The path provided below has to start and end with a slash "/" in order for

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.

  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Muhammad Imran Hussain — Full Stack & Flutter App Developer Portfolio showcasing mobile apps, tech stack, and experience.">
  <meta name="theme-color" content="#0e0e0e">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Imran Portfolio">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <!-- Favicon (SVG for modern crisp display, PNG fallback) -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="alternate icon" href="favicon.png">

  <title>Muhammad Imran Hussain | Portfolio</title>
  <link rel="manifest" href="manifest.json">
</head>

<body>
  <!-- For PDF View-->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.4.456/pdf.min.js"></script>
  <script type="text/javascript">
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.4.456/pdf.worker.min.js";
  </script>

  <!-- Background Soundtrack Audio & Controller -->
  <audio id="portfolio-soundtrack" preload="auto" loop style="display:none">
    <source src="assets/audio/godfather_theme.mp3" type="audio/mpeg">
    <source src="assets/assets/audio/godfather_theme.mp3" type="audio/mpeg">
  </audio>
  <script>
    (function() {
      var audio = null;
      var pendingPlayPromise = null;
      var manuallyPaused = false;
      var gestureListenersAttached = false;
      var gestureEvents = ['pointerdown', 'touchstart', 'click', 'keydown', 'scroll', 'wheel'];

      function getAudio() {
        if (!audio) {
          audio = document.getElementById('portfolio-soundtrack');
        }
        return audio;
      }

      function onUserGesture() {
        if (manuallyPaused) {
          removeGestureListeners();
          return;
        }
        removeGestureListeners();
        window.__portfolioSoundtrack.play();
      }

      function setupGestureListeners() {
        if (gestureListenersAttached || manuallyPaused) return;
        gestureListenersAttached = true;
        for (var i = 0; i < gestureEvents.length; i++) {
          window.addEventListener(gestureEvents[i], onUserGesture, { passive: true, capture: true });
        }
      }

      function removeGestureListeners() {
        if (!gestureListenersAttached) return;
        gestureListenersAttached = false;
        for (var i = 0; i < gestureEvents.length; i++) {
          window.removeEventListener(gestureEvents[i], onUserGesture, { capture: true });
        }
      }

      window.__portfolioSoundtrack = {
        init: function() {
          var el = getAudio();
          if (el) {
            el.volume = 0.35;
          }
        },
        play: function() {
          var el = getAudio();
          if (!el) return;
          manuallyPaused = false;
          removeGestureListeners();

          if (!el.paused) return;

          try {
            var promise = el.play();
            if (promise && typeof promise.then === 'function') {
              pendingPlayPromise = promise;
              promise.then(function() {
                pendingPlayPromise = null;
              }).catch(function(err) {
                pendingPlayPromise = null;
                // Autoplay blocked by browser policy: unlock on first interaction
                setupGestureListeners();
              });
            }
          } catch (err) {
            pendingPlayPromise = null;
          }
        },
        pause: function() {
          var el = getAudio();
          if (!el) return;
          manuallyPaused = true;
          removeGestureListeners();

          if (pendingPlayPromise) {
            pendingPlayPromise.then(function() {
              if (manuallyPaused && el) {
                try { el.pause(); } catch (_) {}
              }
            }).catch(function() {});
          } else {
            try { el.pause(); } catch (_) {}
          }
        },
        toggle: function() {
          var el = getAudio();
          if (!el) return;
          if (el.paused) {
            this.play();
          } else {
            this.pause();
          }
        },
        setVolume: function(vol) {
          var el = getAudio();
          if (el) {
            el.volume = Math.max(0, Math.min(1, vol));
          }
        },
        toggleMute: function() {
          var el = getAudio();
          if (el) {
            el.muted = !el.muted;
          }
        }
      };

      // Autoplay attempt on load
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
          window.__portfolioSoundtrack.play();
        });
      } else {
        window.__portfolioSoundtrack.play();
      }
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
