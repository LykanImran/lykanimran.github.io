<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Muhammad Imran Hussain — Full Stack & Flutter App Developer Portfolio showcasing mobile apps, tech stack, and experience.">
  <meta name="theme-color" content="#0e0e0e">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Imran Portfolio">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <!-- Favicon (SVG for modern crisp display, PNG fallback) -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="alternate icon" href="favicon.png">

  <title>Muhammad Imran Hussain | Portfolio</title>
  <link rel="manifest" href="manifest.json">
</head>

<body>
  <!-- For PDF View-->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.4.456/pdf.min.js"></script>
  <script type="text/javascript">
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.4.456/pdf.worker.min.js";
  </script>

  <!-- Portfolio Background Soundtrack (The Godfather Theme) -->
  <audio id="portfolio-soundtrack" preload="auto" loop playsinline style="display:none;">
    <source src="assets/audio/godfather_theme.mp3" type="audio/mpeg">
    <source src="assets/assets/audio/godfather_theme.mp3" type="audio/mpeg">
  </audio>
  <script type="text/javascript">
    (function() {
      var audio = document.getElementById('portfolio-soundtrack');
      if (!audio) return;
      audio.volume = 0.35;

      function unlockAudio() {
        if (window.__portfolioSoundtrackManuallyPaused) return;
        var p = audio.play();
        if (p && p.then) {
          p.then(function() {
            removeListeners();
          }).catch(function() {});
        }
      }

      function removeListeners() {
        var events = ['click', 'touchstart', 'touchend', 'pointerdown', 'pointerup', 'keydown'];
        events.forEach(function(e) {
          window.removeEventListener(e, unlockAudio, true);
          document.removeEventListener(e, unlockAudio, true);
        });
      }

      var events = ['click', 'touchstart', 'touchend', 'pointerdown', 'pointerup', 'keydown'];
      events.forEach(function(e) {
        window.addEventListener(e, unlockAudio, { capture: true, passive: true });
        document.addEventListener(e, unlockAudio, { capture: true, passive: true });
      });

      // Attempt immediate unmuted autoplay on load
      unlockAudio();
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
